services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:-mongodb://app:app@db:27017/pizza-ya?authSource=admin}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-3100}:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:-mongodb://app:app@db:27017/pizza-ya?authSource=admin}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mongo:7.0.14
    ports:
      - "${DB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app
      MONGO_INITDB_DATABASE: pizza-ya
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mongodata:
